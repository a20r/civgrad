# map/semiconductors/net.yaml — the semiconductor slice, WITH provenance.
#
# SOURCE OF TRUTH for parameter values: core/map_loader.py builds the
# discrete net (core/net.py) and the continuous relaxation
# (core/continuous.py) from this file — tokens, rebuild times, regions, arc
# weights, capacities, oracle contracts, frozen globals. A data PR that
# improves a number here changes the model directly: it needs a citation
# (PLAN.md §2: no source, no merge) and must pass the validation gate. The
# engine's ordered name lists (index layout) live in core/ and are asserted
# against this file at import; structural changes touch both, consciously
# (subnet PR).
#
# Provenance schema (PLAN.md §2): every numeric parameter carries
#   {value, units, source, confidence: A|B|C, date}
# Confidence grades are assigned by reviewers, not authors. Parameters whose
# values a real source supports now carry that URL (added 2026-07-27; each
# fetched and quote-checked before citing — see the PR); everything else is
# still a session estimate. ALL confidences remain C until the reviewer
# upgrades them. `note` keys record how a citation anchors a value (or where
# a documented figure disagrees with the session estimate); the loader
# ignores them. Do not invent citations.

_session_estimate: &sess
  source: "session estimate — needs citation"
  confidence: C
  date: "2026-07-22"

net: "GSC:semiconductors"   # legacy internal name, kept: renaming is cosmetic
                            # and the baseline regression check quotes it
arc_weights: >-
  All v0.1 arcs are unit stoichiometry (1 token per firing), confidence C,
  session estimate. A future non-unit weight must carry its own inline
  provenance dict.

# ---------------------------------------------------------------- places ----
places:
  - name: Ga_byproduct
    region: global
    initial_tokens: {value: 3, units: tokens, <<: *sess}
    rebuild_years:  {value: 0.1, units: years, <<: *sess}
  - name: Ga_refined
    region: china
    initial_tokens: {value: 1, units: tokens, <<: *sess}
    rebuild_years:
      value: 2.5
      units: years
      confidence: C
      date: "2026-07-27"
      source: "https://www.csis.org/analysis/beyond-rare-earths-chinas-growing-threat-gallium-supply-chains"
      note: >-
        Western restart projects announced 2024-25 target 2027 output (Metlen
        50 t/yr, Stade ~40 t/yr); CSIS: not at full capacity "before
        mid-2027, at best" — i.e. ~2.5-3 years from the Dec 2024 ban.
        Concentration context: China was 98% of primary low-purity gallium in
        2023, 99% in 2024 (USGS MCS,
        https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-gallium.pdf).
  - name: Ne_crude
    region: global
    initial_tokens: {value: 2, units: tokens, <<: *sess}
    rebuild_years:  {value: 0.5, units: years, <<: *sess}
  - name: Ne_purified
    region: mixed
    initial_tokens: {value: 1, units: tokens, <<: *sess}
    rebuild_years:
      value: 1.5
      units: years
      confidence: C
      date: "2026-07-27"
      source: "https://news.skhynix.com/sk-hynix-sources-neon-gas-locally/"
      note: >-
        The 2022 replacement ramp ran ~12-18 months: POSCO/TEMC line from Jan
        2022, SK hynix 40% locally sourced by Oct 2022 (100% targeted 2024);
        supply normalized through 2023 (see validation/events/neon_2022.yaml
        sources).
  - name: EUV_tools
    region: netherlands
    initial_tokens: {value: 1, units: tokens, <<: *sess}
    rebuild_years:
      value: 10
      units: years
      confidence: C
      date: "2026-07-27"
      source: "https://www.trendforce.com/news/2024/12/23/news-asml-ceo-christophe-fouquet-u-s-euv-export-ban-causes-chinas-chip-making-to-lag-by-10-15-years/"
      note: >-
        ASML CEO Fouquet (NRC interview, Dec 2024): a country denied EUV
        machines lags "10 to 15 years" — and he called that optimistic. 10 is
        the low end of the documented replication estimate.
  - name: EUV_optics
    region: germany            # Zeiss, sole source
    initial_tokens: {value: 1, units: tokens, <<: *sess}
    rebuild_years:
      value: 15
      units: years
      confidence: C
      date: "2026-07-27"
      source: "https://www.trendforce.com/news/2024/12/23/news-asml-ceo-christophe-fouquet-u-s-euv-export-ban-causes-chinas-chip-making-to-lag-by-10-15-years/"
      note: >-
        Upper end of the documented 10-15 year replication estimate; Zeiss
        SMT is ASML's single supplier of optics (ASML 20-F,
        https://www.sec.gov/Archives/edgar/data/0000937966/000093796617000007/a20-fasml2016.htm)
        and its EUV-optics program is 30 years old
        (https://www.zeiss.com/semiconductor-manufacturing-technology/news-and-events/smt-press-releases/2025/euv-30-years.html).
  - name: EUV_worn
    region: taiwan
    initial_tokens: {value: 0, units: tokens, <<: *sess}
    rebuild_years:  {value: 0, units: years, <<: *sess}
  - name: Wafers_advanced
    region: taiwan
    initial_tokens: {value: 1, units: tokens, <<: *sess}
    rebuild_years:
      value: 8
      units: years
      <<: *sess
      note: >-
        Session estimate between documented anchors: fab/plant construction
        runs ~2-4 years on average
        (https://www.construction-physics.com/p/how-to-build-a-20-billion-semiconductor)
        but replicating a concentrated capability abroad is documented as far
        harder (ecosystem/talent gaps: https://www.cfr.org/articles/onshoring-semiconductor-production-national-security-versus-economic-efficiency).
  - name: Chips_fabbed
    region: taiwan
    initial_tokens: {value: 0, units: tokens, <<: *sess}
    rebuild_years:
      value: 8
      units: years
      <<: *sess
      note: >-
        Session estimate between documented anchors: a leading-edge fab costs
        $10-20B+ and builds in ~2-4 years (construction-physics.com, above),
        while Taiwan holds ~92% of most-advanced capacity
        (https://www.usitc.gov/publications/332/executive_briefings/ebot_silicon_island_taiwan_semiconductor.pdf)
        and replicating the TSMC-class ecosystem abroad is documented only
        qualitatively as much slower.
  - name: Chips_packaged
    region: taiwan
    initial_tokens: {value: 0, units: tokens, <<: *sess}
    rebuild_years:
      value: 4
      units: years
      <<: *sess
      note: >-
        Session estimate; documented anchor: Amkor's Peoria AZ advanced
        packaging plant targeted first-phase production ~2-3 years from its
        2023 announcement
        (https://www.manufacturingdive.com/news/amkor-to-construct-2-billion-semiconductor-packaging-and-test-facility-in-Peoria-arizona/701268/).
  - name: Goods
    region: global
    initial_tokens: {value: 0, units: tokens, <<: *sess}
    rebuild_years:  {value: 1, units: years, <<: *sess}
  - name: E_waste
    region: global
    initial_tokens: {value: 0, units: tokens, <<: *sess}
    rebuild_years:  {value: 0, units: years, <<: *sess}
  - name: ExportBan_CN_US
    region: policy             # policy token: presence BLOCKS Refine_Ga
    initial_tokens: {value: 0, units: tokens, <<: *sess}
    rebuild_years:  {value: 0, units: years, <<: *sess}

# ----------------------------------------------------------- transitions ----
# capacity = relative flow capacity in the continuous relaxation (cap0 in
# core/continuous.py); read_arcs require but do not consume; inhibitors BLOCK
# firing while marked.
transitions:
  - name: Refine_Ga
    region: china
    inputs:  {Ga_byproduct: 1}
    outputs: {Ga_refined: 1}
    inhibitors: [ExportBan_CN_US]
    capacity: {value: 1.0, units: relative flow, <<: *sess}
    note: >-
      The concentration and the inhibitor are documented: China produced 98%
      (2023) / 99% (2024) of primary low-purity gallium (USGS MCS,
      https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-gallium.pdf), imposed
      export licensing Aug 2023 and a US-targeted export ban Dec 3, 2024
      (MOFCOM Doc. 46;
      https://www.csis.org/analysis/china-imposes-its-most-stringent-critical-minerals-export-restrictions-yet-amidst).
  - name: Purify_Ne
    region: mixed
    inputs:  {Ne_crude: 1}
    outputs: {Ne_purified: 1}
    capacity: {value: 1.0, units: relative flow, <<: *sess}
  - name: Fab
    region: taiwan
    inputs:  {Ga_refined: 1, Ne_purified: 1, Wafers_advanced: 1}
    outputs: {Chips_fabbed: 1}
    read_arcs: {EUV_tools: 1}
    capacity: {value: 1.0, units: relative flow, <<: *sess}
    note: >-
      Region documented: Taiwan held ~92% of world manufacturing capacity for
      the most advanced chips in 2021 (USITC,
      https://www.usitc.gov/publications/332/executive_briefings/ebot_silicon_island_taiwan_semiconductor.pdf);
      >90% still cited for 2024 (CFR).
  - name: Package
    region: taiwan
    inputs:  {Chips_fabbed: 1}
    outputs: {Chips_packaged: 1}
    capacity: {value: 1.0, units: relative flow, <<: *sess}
  - name: Ship_TW_Strait
    region: taiwan_strait
    inputs:  {Chips_packaged: 1}
    outputs: {Goods: 1}
    capacity: {value: 1.0, units: relative flow, <<: *sess}
  - name: Consume
    region: global
    inputs:  {Goods: 1}
    outputs: {E_waste: 1}
    capacity: {value: 1.0, units: relative flow, <<: *sess}
  - name: Recycle
    region: global
    inputs:  {E_waste: 1}
    outputs: {Ga_byproduct: 1}
    capacity:            # near-dead loop closure
      value: 0.05
      units: relative flow
      <<: *sess
      note: >-
        Direction documented: USGS records old-scrap (end-of-life) gallium
        recycling as literally "none" (US data, 2024 and 2025 editions;
        https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-gallium.pdf) — only
        new manufacturing scrap is recycled. If anything 0.05 is generous.

  # -- EquipMfg subnet (REFINED from ORACLE_EquipMfg in the design session) --
  - name: Build_EUV
    region: netherlands
    inputs:  {Chips_packaged: 1, EUV_optics: 1}
    outputs: {EUV_tools: 1}
    capacity:            # tools are slow to build
      value: 0.03
      units: relative flow
      <<: *sess
      note: >-
        Slowness anchor: ASML (the sole EUV maker) recognized revenue on 40
        EUV systems in 2022 and 53 in 2023 — a few dozen per year against the
        world's entire fab base (ASML 2023 Annual Report,
        https://www.asml.com/en/investors/annual-report/2023). The 0.03
        relative flow itself remains a session estimate.
  - name: Wear_EUV
    region: taiwan
    inputs:  {EUV_tools: 1}
    outputs: {EUV_worn: 1}
    capacity:            # tools wear ~15%/period
      value: 0.15
      units: relative flow
      <<: *sess
      note: >-
        Wear here means "cycles into refurbishable state", not death: ASML
        reports 95% of all systems sold in 30 years still active and runs a
        refurbished-systems business ("We measure a machine's life in
        decades", https://www.asml.com/en/products/refurbished-systems) —
        which is also the documented anchor for the Refurb loop below.
  - name: Refurb
    region: netherlands
    inputs:  {EUV_worn: 1, Chips_packaged: 1}
    outputs: {EUV_tools: 1}
    capacity: {value: 0.2, units: relative flow, <<: *sess}

  # -- oracles: the zoomed-out neighbors (interfaces in map/_oracles/) --
  - name: ORACLE_Mining
    oracle: true
    interface: map/_oracles/mining.yaml
    region: global
    outputs: {Ga_byproduct: 1, Ne_crude: 1}
    capacity: {value: 1.0, units: relative flow, <<: *sess}    # "Mine" in the relaxation
  - name: ORACLE_WaferSupply
    oracle: true
    interface: map/_oracles/wafer_supply.yaml
    region: japan
    outputs: {Wafers_advanced: 1}
    capacity: {value: 1.0, units: relative flow, <<: *sess}
    note: >-
      Concentration documented: Shin-Etsu (~28%) + SUMCO (~23%) hold just
      over half of global 300mm wafer supply; the top five control ~85%
      (https://www.mordorintelligence.com/industry-reports/semiconductor-silicon-wafer-market).
  - name: ORACLE_Optics
    oracle: true
    interface: map/_oracles/optics.yaml
    region: germany
    outputs: {EUV_optics: 1}
    capacity: {value: 0.03, units: relative flow, <<: *sess}   # Zeiss is slow to scale
  - name: ORACLE_Fertilizer
    oracle: true
    interface: map/_oracles/fertilizer.yaml
    region: morocco
    outputs: {}

# ------------------------------------------------------------ continuous ----
continuous:
  note: >-
    core/continuous.py relaxes this net (all stocks start at 1.0; the policy
    inhibitor and ORACLE_Fertilizer are not represented). Aliases map discrete
    names to the continuous model's names.
  aliases:
    Wafers_advanced: Wafers
    Chips_fabbed: Chips
    Chips_packaged: Pkg
    Ship_TW_Strait: Ship_Strait
    ORACLE_Mining: Mine
    ORACLE_WaferSupply: WaferSupply
    ORACLE_Optics: OpticsMfg

# -------------------------------------------------------- frozen globals ----
# Set during the neon training event and FROZEN. Changing any of these is a
# methodology PR (PLAN.md §3-4, AGENTS.md) — never a data or subnet PR.
frozen_globals:
  K_SAT:       {value: 0.05, units: months of stock (Michaelis-Menten k), frozen: true, <<: *sess}
  ALPHA:       {value: 0.06, units: 1/month capacity-rebuild gain, frozen: true,
                fitted_on: neon_2022, <<: *sess}
  HORIZON:     {value: 6.0, units: months of runway, frozen: true, <<: *sess}
  utilization: {value: 0.90, units: fraction (pre-shock calibration rule), frozen: true, <<: *sess}
