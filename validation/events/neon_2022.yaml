# Frozen event definition — documented facts only. Do not tune to fit.
# Field semantics: see validation/runner.py docstring.
name: neon_2022
title: "2022 neon shock (Russia-Ukraine war: Ingas + Cryoin halt)"
short: "2022 neon shock"
year: 2022
order: 0
role: training          # ALPHA and the calibration rule were set on this event
status: pass

transition: Purify_Ne
capacity_lost: 0.5      # Ingas (Mariupol) + Cryoin (Odesa): ~half of world
                        # semiconductor-grade neon purification CAPACITY (not stock)
ramp_tau_months: 9.0    # imposed-tau protocol only: alternative purification
                        # (China, Linde, POSCO) ramped over ~12-18 months
shock_month: 6.0
buffers:
  Ne_purified: 6.0      # chipmakers held ~6mo stockpiles — the 2014 Crimea lesson
counterfactual_buffer_months: 0.5   # lean/JIT counterfactual (not scored)
observable: fab

history: "no fab stoppages; supply normalized ~12-18mo"
history_note: >-
  No major fab stoppages were attributed to neon; chipmakers had built
  stockpiles after the 2014 Crimea price spike (documented range: up to ~6
  months at the largest producers, 4-6 weeks at smaller ones — the yaml's 6.0
  is the documented upper end, see sources). Alternative purification
  capacity ramped over roughly 12-18 months (Korea: POSCO/TEMC line from Jan
  2022, SK hynix 40% locally sourced by Oct 2022; China's share rose).
  Neon prices spiked ~9x invasion-day levels within ~6 weeks (China wholesale).
sources:                # added 2026-07-27; every URL fetched and quote-checked
                        # before citing (see PR); confidence grades remain for
                        # the reviewer (AGENTS.md rule 4)
