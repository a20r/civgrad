    date: "2022-04"
    supports: "Ukraine ~half of world neon (Soviet steel-industry legacy; byproduct of liquid-oxygen generation); Cryoin + Ingas unable to produce as of 2022-03-11; post-2014 prices spiked >600%; firms stockpiled"
  - url: https://techmonitor.ai/silicon/chip-industry-russia-ukraine-war-neon
    publisher: "Tech Monitor"
    date: "2022-03"
    supports: "larger chip producers held up to ~6 months of neon; smaller makers 4-6 weeks; contingency plans date to Crimea 2014"
  - url: https://www.scmp.com/tech/tech-trends/article/3170869/war-ukraine-inflates-price-neon-chip-making-it-might-be-good-china
