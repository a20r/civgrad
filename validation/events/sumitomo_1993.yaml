name: sumitomo_1993
title: "1993 Sumitomo Chemical epoxy-resin plant explosion (chip packaging)"
short: "1993 Sumitomo (packaging)"
year: 1993
order: 2
role: holdout
status: xfail

transition: Package
capacity_lost: 0.60     # the plant supplied ~60% of world epoxy molding compound
                        # for chip packaging
ramp_tau_months: 6.0    # imposed-tau protocol only
shock_month: 6.0
buffers:
  Chips: 1.5            # ~6 weeks of packaged/unpackaged chip inventory
observable: delivered   # the pain was in DELIVERED chips (price), not fab starts

history: "price spike, brief pain, no catastrophe"
sources:                # added 2026-07-27; every URL fetched and quote-checked
                        # before citing (see PR); confidence grades remain for
                        # the reviewer (AGENTS.md rule 4)
  - url: https://scholar.lib.vt.edu/VA-news/ROA-Times/issues/1993/rt9307/930723/07230121.htm
    publisher: "Roanoke Times & World-News (Virginia Tech news archive)"
    date: "1993-07-23"
    supports: "July 4 fire destroyed the Sumitomo Chemical plant in Niihama supplying 60% of the epoxy resin for DRAM manufacture; some memory prices ~doubled in weeks (1MB module $55 -> $120); analysts called the rise anticipatory, 'not because [a shortage] exists'"
  - url: https://www.techmonitor.ai/technology/chip_panic_to_intensify_as_epoxy_stocks_dwindle
    publisher: "Tech Monitor (Computer Business Review archive, 1993-08-04)"
    date: "1993-08-04"
    supports: "explosion cut off 60% of world production of the encapsulation epoxy; most companies held one-two months of resin inventory (buffers 1.5 sits in this band); within a month Sumitomo had arranged >half its usual output from other Japanese producers"
  - url: https://www.upi.com/Archives/1993/07/22/Computer-memory-chip-prices-stabilize-after-factory-fire-sends-them-soaring/7204743313600/
    publisher: "UPI Archives"
    date: "1993-07-22"
    supports: "headline: memory-chip prices stabilize after the factory fire sent them soaring (fetch-blocked at citation time; verified live for the essay in blog PR #6)"
value_notes: >-
  capacity_lost 0.60 is the contemporaneously sourced world-supply share.
  The 'brief pain' record: substitution covered >50% of lost output within a
  month, and the November 1993 UPI follow-up ('resin shortage averted',
  1993-11-30) closes the arc at ~5 months — consistent with the acceptance
  band's recovery 3±3 mo.

expected:
  dip_pct: 15           # "price spike, brief pain" -> real but bounded dip (0-30%)
  recovery_months: 3    # "brief" -> normalized within ~6 months
  tolerance: {dip_pct: 15, recovery_months: 3}
band_note: >-
  Round-number encoding of "price spike, brief pain, no catastrophe", written
  before statuses were computed; not a measured statistic. Note the band floor
  is 0% dip: history records real pain, so a model that shows nothing at all
  misses too.

xfail_reason: >-
  The model misses this event twice, in opposite directions. Protocol v0
  (imposed-tau, observing fab flow) shows dip ~0%: packaging halts do not stop
  fabs, so through the fab observable the event is invisible — the
  wrong-observable failure from the design history. Protocol v1 (adaptive,
  observing delivered flow) shows a ~58% dip with no recovery inside the
  72-month horizon — a hysteresis trap: the adaptation law rebuilds capacity,
  but the price-mediated demand reallocation that pulled the real system back
  in months does not exist in the model. This is the failing test that
  motivates the demand/allocation work (PLAN.md §5) and opened the
  packaging_resin oracle (map/_oracles/packaging_resin.yaml).

baseline_v0_1:
  tau_replay: {dip_pct: -1.7, recovery_months: 0}
  adaptive:   {dip_pct: 57.6, recovery_months: .inf}
