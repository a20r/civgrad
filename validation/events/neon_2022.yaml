  - url: https://www.koreaherald.com/article/2759302
    publisher: "The Korea Herald"
    date: "2022-01"
    supports: "POSCO/TEMC neon line: 22,000 Nm3/yr from Jan 2022 (~16% of Korean demand)"
value_notes: >-
  capacity_lost 0.5 sits inside the sourced 45-54% band. buffers.Ne_purified
  6.0 is the documented UPPER end (largest producers only; smaller makers held
  4-6 weeks) — kept as frozen since this event trained ALPHA; a data PR
  revisiting it must register predictions first (AGENTS.md rule 3).

expected:               # acceptance band encoding the historical record, applied
                        # to the stockpiled (historical) replay in both protocols
  dip_pct: 0            # "no fab stoppages" -> dip indistinguishable from zero
  recovery_months: 15   # "normalized ~12-18mo" -> minimum/normalization inside ~0-30mo
  tolerance: {dip_pct: 5, recovery_months: 15}
band_note: >-
  The band is a round-number encoding of the qualitative record above, written
  before statuses were computed; it is not a measured statistic. With a ~0% dip
  the 95%-recovery metric degenerates to time-of-minimum, hence the wide
  recovery band.

baseline_v0_1:          # informational: frozen v0.1 model outputs (regression context)
  tau_replay: {dip_pct: 0.1, recovery_months: 16}
