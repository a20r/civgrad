    publisher: "Reuters (wire text via Business Standard mirror)"
    date: "2022-03-12"
    supports: "Ingas + Cryoin = 45-54% of world semiconductor-grade neon; both halted by 2022-03-11; 2014 Crimea spike ~600%; stockpile estimates 'vary widely'"
